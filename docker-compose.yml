version: '3.8'

services:
  # RAKSHAROVER Backend API & Real-time WebSocket Gateway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raksharover-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - SERVE_FRONTEND=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - raksharover-net

  # RAKSHAROVER Smartwatch UI Frontend (Nginx Alpine)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: raksharover-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - raksharover-net

networks:
  raksharover-net:
    driver: bridge
